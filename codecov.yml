codecov:
  branch: master

comment: false

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

ignore:
  - "**/browse.R"
  - "browse.R"
  - "**/zzz.R"
  - "zzz.R"
  - "R/check_python.R"
  - "R/check_spacy.R"
  - "R/check_reticulate.R"
