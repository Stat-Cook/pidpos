name: Test reticulate API

on:
  workflow_dispatch:

jobs:
  test-spacy-install:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
     
      - name: Install pidpos
        run: |
          install.packages(c("devtools", "testthat"))
          devtools::install_local(dependencies = c("Depends", "Imports", "LinkingTo"))
        shell: Rscript {0}

      - name: Tests without `reticulate`
        run: devtools::test()
        shell: Rscript {0}

      - name: Install R dependencies
        run: |
          install.packages(c("reticulate", "testthat"))
          devtools::install_deps()
        shell: Rscript {0}
      
      - name: Tests with `reticulate`
        run: devtools::test()
        shell: Rscript {0}
